name: rukny-dev

services:
  postgres:
    image: postgres:16-alpine
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-rukny_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-rukny_io}
    ports:
      - "127.0.0.1:5433:5432"
    volumes:
      - postgres_dev_data:/var/lib/postgresql/data
    networks:
      - rukny_dev_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rukny_admin} -d ${DB_NAME:-rukny_io}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6380:6379"
    volumes:
      - redis_dev_data:/data
    networks:
      - rukny_dev_network
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a '${REDIS_PASSWORD}' ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    restart: always
    command:
      - sh
      - -c
      - >-
        node -e "const net=require('net'); const retry=()=>{const socket=net.createConnection({host:'postgres',port:5432},()=>{socket.end(); process.exit(0);}); socket.on('error',()=>setTimeout(retry,1000));}; retry();"
        && npx prisma db push --accept-data-loss --config prisma/prisma.config.ts
        && node dist/main
    env_file:
      - ./.env.dev
    ports:
      - "0.0.0.0:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      SESSION_FINGERPRINT_STRICT: "false"
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${DB_USER:-rukny_admin}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-rukny_io}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      FRONTEND_URL: http://localhost:3000
      FRONTEND_URL_ALT: http://localhost:3000
      APP_FRONTEND_URL: http://localhost:3000
      FORMS_APP_URL: http://localhost:3007
      HQ_FRONTEND_URL: http://localhost:3002
      AUTH_FRONTEND_URL: http://localhost:3005
      AUTH_BASE_URL: http://localhost:3001
      COOKIE_DOMAIN: ""
      COOKIE_SECURE: "false"
      COOKIE_HTTPONLY: "true"
      COOKIE_SAMESITE: "Lax"
      GOOGLE_CALLBACK_URL: http://localhost:3001/api/v1/auth/google/callback
      GITHUB_CALLBACK_URL: http://localhost:3001/api/v1/auth/github/callback
      LINKEDIN_CALLBACK_URL: http://localhost:3001/api/v1/auth/linkedin/callback
      LINKEDIN_INTEGRATION_CALLBACK_URL: http://localhost:3001/api/v1/integrations/linkedin/callback
      INSTAGRAM_REDIRECT_URI: http://localhost:3001/api/v1/integrations/instagram/callback
      YOUTUBE_REDIRECT_URI: http://localhost:3001/api/v1/integrations/youtube/callback
      GOOGLE_SHEETS_REDIRECT_URI: http://localhost:3001/api/v1/integrations/google-sheets/callback
      QASEH_REDIRECT_URL: http://localhost:3000/payment/callback
      QASEH_WEBHOOK_URL: http://localhost:3001/api/v1/payments/qaseh/webhook
      # Trust Docker BFF containers so X-Forwarded-For reaches getClientIp()
      TRUSTED_PROXY_CIDRS: 172.16.0.0/12,10.0.0.0/8
    networks:
      - rukny_dev_network

  accounts:
    build:
      context: .
      dockerfile: apps/accounts/Dockerfile
      args:
        API_BACKEND_URL: http://api:3001
        NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        NEXT_PUBLIC_OAUTH_GITHUB_ENABLED: "true"
    restart: always
    env_file:
      - ./.env.dev
    ports:
      - "127.0.0.1:3005:3005"
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3005
      API_BACKEND_URL: http://api:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_OAUTH_GITHUB_ENABLED: "true"
    networks:
      - rukny_dev_network

  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
      args:
        API_BACKEND_URL: http://api:3001
        NEXT_PUBLIC_API_EXTERNAL_URL: http://localhost:3001/api/v1
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        NEXT_PUBLIC_ROOT_DOMAIN: ""
        NEXT_PUBLIC_APP_ENV: development
    restart: always
    env_file:
      - ./.env.dev
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      API_BACKEND_URL: http://api:3001
      API_URL: http://api:3001
      NEXT_PUBLIC_API_EXTERNAL_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_ROOT_DOMAIN: ""
      NEXT_PUBLIC_APP_ENV: development
    networks:
      - rukny_dev_network

  hq:
    build:
      context: .
      dockerfile: apps/hq/Dockerfile
      args:
        API_BACKEND_URL: http://api:3001
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_API_EXTERNAL_URL: http://localhost:3001/api/v1
        NEXT_PUBLIC_APP_URL: http://localhost:3002
        NEXT_PUBLIC_ACCOUNTS_URL: http://localhost:3005
    restart: always
    env_file:
      - ./.env.dev
    ports:
      - "127.0.0.1:3002:3002"
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3002
      API_BACKEND_URL: http://api:3001
      JWT_SECRET: ${JWT_SECRET}
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_API_EXTERNAL_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3002
      NEXT_PUBLIC_ACCOUNTS_URL: http://localhost:3005
    networks:
      - rukny_dev_network

  workspace:
    build:
      context: .
      dockerfile: apps/workspace/Dockerfile
      args:
        API_BACKEND_URL: http://api:3001
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_API_EXTERNAL_URL: http://localhost:3001/api/v1
        NEXT_PUBLIC_APP_URL: http://localhost:3003
        NEXT_PUBLIC_ACCOUNTS_URL: http://localhost:3005
    restart: always
    env_file:
      - ./.env.dev
    ports:
      - "127.0.0.1:3003:3003"
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3003
      API_BACKEND_URL: http://api:3001
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_API_EXTERNAL_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3003
      NEXT_PUBLIC_ACCOUNTS_URL: http://localhost:3005
    networks:
      - rukny_dev_network

  public:
    build:
      context: .
      dockerfile: apps/public/Dockerfile
      args:
        API_BACKEND_URL: http://api:3001
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_API_EXTERNAL_URL: http://localhost:3001/api/v1
        NEXT_PUBLIC_APP_URL: http://localhost:3006
        NEXT_PUBLIC_ACCOUNTS_URL: http://localhost:3005
    restart: always
    env_file:
      - ./.env.dev
    ports:
      - "127.0.0.1:3006:3006"
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3006
      API_BACKEND_URL: http://api:3001
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_API_EXTERNAL_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3006
      NEXT_PUBLIC_ACCOUNTS_URL: http://localhost:3005
    networks:
      - rukny_dev_network


  developers:
    build:
      context: .
      dockerfile: apps/developer/Dockerfile
      args:
        API_BACKEND_URL: http://api:3001
        NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        NEXT_PUBLIC_ACCOUNTS_URL: http://localhost:3005
        NEXT_PUBLIC_BUSINESS_URL: http://localhost:3003
        NEXT_PUBLIC_DEVELOPERS_URL: http://localhost:3004
        NEXT_PUBLIC_FORMS_URL: http://localhost:3007
        NEXT_PUBLIC_PUBLIC_SITE_URL: http://localhost:3006
        NEXT_PUBLIC_ROOT_DOMAIN: localhost
    restart: always
    env_file:
      - ./.env.dev
    ports:
      - "127.0.0.1:3004:3004"
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3004
      API_BACKEND_URL: http://api:3001
      API_URL: http://api:3001
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      NEXT_PUBLIC_ACCOUNTS_URL: http://localhost:3005
      NEXT_PUBLIC_DEVELOPERS_URL: http://localhost:3004
      NEXT_PUBLIC_FORMS_URL: http://localhost:3007
    networks:
      - rukny_dev_network

  forms:
    build:
      context: .
      dockerfile: apps/forms/Dockerfile
      args:
        API_BACKEND_URL: http://api:3001
        NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
        NEXT_PUBLIC_ACCOUNTS_URL: http://localhost:3005
        NEXT_PUBLIC_FORMS_URL: http://localhost:3007
        NEXT_PUBLIC_APP_URL: http://localhost:3000
        JWT_SECRET: ${JWT_SECRET}
    restart: always
    env_file:
      - ./.env.dev
    ports:
      - "127.0.0.1:3007:3007"
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3007
      HOSTNAME: 0.0.0.0
      NEXT_PUBLIC_API_URL: http://localhost:3001/api/v1
      NEXT_PUBLIC_ACCOUNTS_URL: http://localhost:3005
      NEXT_PUBLIC_FORMS_URL: http://localhost:3007
      NEXT_PUBLIC_APP_URL: http://localhost:3000
      API_BACKEND_URL: http://api:3001
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
    networks:
      - rukny_dev_network

  pgadmin:
    image: dpage/pgadmin4:latest
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@rukny.io}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: 5050
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_WTF_CSRF_SSL_STRICT: "False"
      SCRIPT_NAME: ""
    ports:
      - "127.0.0.1:5051:5050"
    volumes:
      - pgadmin_dev_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rukny_dev_network

networks:
  rukny_dev_network:
    driver: bridge

volumes:
  postgres_dev_data:
  redis_dev_data:
  pgadmin_dev_data: