# ============================================
# PRODUCTION Docker Compose
# Deploy on DigitalOcean VPS
# ============================================

services:
  # ─── PostgreSQL Database ───
  postgres:
    image: postgres:16-alpine
    container_name: rukny_postgres
    restart: always
    environment:
      POSTGRES_USER: ${DB_USER:-rukny_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME:-rukny_io}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    networks:
      - rukny_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-rukny_admin} -d ${DB_NAME:-rukny_io}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── Redis Cache ───
  redis:
    image: redis:7-alpine
    container_name: rukny_redis
    restart: always
    command: redis-server --requirepass ${REDIS_PASSWORD}
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    networks:
      - rukny_network
    healthcheck:
      test: ["CMD", "redis-cli", "-a", "${REDIS_PASSWORD}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ─── NestJS API ───
  api:
    build:
      context: ./apps/api
      dockerfile: Dockerfile
    container_name: rukny_api
    restart: always
    command:
      - sh
      - -c
      - >-
        node -e "const net=require('net'); const retry=()=>{const socket=net.createConnection({host:'postgres',port:5432},()=>{socket.end(); process.exit(0);}); socket.on('error',()=>setTimeout(retry,1000));}; retry();"
        && npx prisma migrate deploy --config prisma/prisma.config.ts
        && node dist/main
    ports:
      - "0.0.0.0:3001:3001"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${DB_USER:-rukny_admin}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-rukny_io}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      FORMS_OTP_PEPPER: ${FORMS_OTP_PEPPER}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET}
      FRONTEND_URL: ${FRONTEND_URL:-http://localhost:3000}
      FRONTEND_URL_ALT: ${FRONTEND_URL_ALT:-http://localhost:3000}
      APP_FRONTEND_URL: ${APP_FRONTEND_URL:-http://localhost:3000}
      AUTH_FRONTEND_URL: ${AUTH_FRONTEND_URL:-http://localhost:3000}
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:3001}
      FORM_PUBLIC_BASE_URL: ${FORM_PUBLIC_BASE_URL:-https://rukny.io}
      FORMS_APP_URL: ${FORMS_APP_URL:-${FORMS_FRONTEND_URL:-https://forms.rukny.io}}
      FORMS_FRONTEND_URL: ${FORMS_FRONTEND_URL:-https://forms.rukny.io}
      API_PUBLIC_URL: ${API_PUBLIC_URL:-https://api.rukny.io}
      DEVELOPERS_FRONTEND_URL: https://${DEVELOPERS_DOMAIN:-developers.rukny.io}
      BUSINESS_FRONTEND_URL: https://${BUSINESS_DOMAIN:-business.rukny.io}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-false}
      # Trust nginx/accounts/docker hops so OAuth IP binding uses real client IP
      TRUSTED_PROXY_MODE: ${TRUSTED_PROXY_MODE:-xff}
      TRUSTED_PROXY_CIDRS: ${TRUSTED_PROXY_CIDRS:-172.16.0.0/12,10.0.0.0/8}
      # OAuth
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL:-http://localhost:3001/api/v1/auth/google/callback}
      GITHUB_CLIENT_ID: ${GITHUB_CLIENT_ID}
      GITHUB_CLIENT_SECRET: ${GITHUB_CLIENT_SECRET}
      GITHUB_CALLBACK_URL: ${GITHUB_CALLBACK_URL:-http://localhost:3001/api/v1/auth/github/callback}
      OAUTH_GITHUB_ENABLED: ${OAUTH_GITHUB_ENABLED:-true}
      LINKEDIN_CLIENT_ID: ${LINKEDIN_CLIENT_ID}
      LINKEDIN_CLIENT_SECRET: ${LINKEDIN_CLIENT_SECRET}
      LINKEDIN_CALLBACK_URL: ${LINKEDIN_CALLBACK_URL:-http://localhost:3001/api/v1/auth/linkedin/callback}
      LINKEDIN_INTEGRATION_CALLBACK_URL: ${LINKEDIN_INTEGRATION_CALLBACK_URL:-http://localhost:3001/api/v1/integrations/linkedin/callback}
      LINKEDIN_SCOPES: ${LINKEDIN_SCOPES:-openid,profile,email}
      FACEBOOK_APP_ID: ${FACEBOOK_APP_ID}
      FACEBOOK_APP_SECRET: ${FACEBOOK_APP_SECRET}
      FACEBOOK_CALLBACK_URL: ${FACEBOOK_CALLBACK_URL:-http://localhost:3001/api/v1/auth/facebook/callback}
      FACEBOOK_CONFIG_ID: ${FACEBOOK_CONFIG_ID:-}

      # Email
      RESEND_API_KEY: ${RESEND_API_KEY}
      RESEND_FROM_EMAIL: ${RESEND_FROM_EMAIL:-notifications@rukny.work}
      # AWS
      AWS_ACCESS_KEY_ID: ${AWS_ACCESS_KEY_ID}
      AWS_SECRET_ACCESS_KEY: ${AWS_SECRET_ACCESS_KEY}
      AWS_REGION: ${AWS_REGION:-us-east-1}
      S3_BUCKET: ${S3_BUCKET}
      # Instagram Integration
      INSTAGRAM_APP_ID: ${INSTAGRAM_APP_ID}
      INSTAGRAM_APP_SECRET: ${INSTAGRAM_APP_SECRET}
      INSTAGRAM_REDIRECT_URI: ${INSTAGRAM_REDIRECT_URI:-https://business.rukny.io/api/v1/integrations/instagram/callback}
      INSTAGRAM_WEBHOOK_VERIFY_TOKEN: ${INSTAGRAM_WEBHOOK_VERIFY_TOKEN}
      # YouTube Integration
      YOUTUBE_CLIENT_ID: ${YOUTUBE_CLIENT_ID}
      YOUTUBE_CLIENT_SECRET: ${YOUTUBE_CLIENT_SECRET}
      YOUTUBE_REDIRECT_URI: ${YOUTUBE_REDIRECT_URI:-http://localhost:3001/api/v1/integrations/youtube/callback}
      YOUTUBE_API_KEY: ${YOUTUBE_API_KEY}
      # Google Sheets / Calendar Integration (reuses Google OAuth credentials)
      GOOGLE_SHEETS_CLIENT_ID: ${GOOGLE_SHEETS_CLIENT_ID:-${GOOGLE_CLIENT_ID}}
      GOOGLE_SHEETS_CLIENT_SECRET: ${GOOGLE_SHEETS_CLIENT_SECRET:-${GOOGLE_CLIENT_SECRET}}
      GOOGLE_SHEETS_REDIRECT_URI: ${GOOGLE_SHEETS_REDIRECT_URI:-http://localhost:3001/api/v1/integrations/google-sheets/callback}
      GOOGLE_DRIVE_REDIRECT_URI: ${GOOGLE_DRIVE_REDIRECT_URI:-http://localhost:3001/api/v1/integrations/google-drive/callback}
      GOOGLE_CALENDAR_CLIENT_ID: ${GOOGLE_CLIENT_ID}
      GOOGLE_CALENDAR_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET}
      GOOGLE_CALENDAR_REDIRECT_URI: ${GOOGLE_CALENDAR_REDIRECT_URI:-http://localhost:3001/api/v1/google/calendar/callback}
      # WhatsApp Business API (Meta Cloud API)
      WHATSAPP_BUSINESS_TOKEN: ${WHATSAPP_BUSINESS_TOKEN}
      WHATSAPP_PHONE_NUMBER_ID: ${WHATSAPP_PHONE_NUMBER_ID}
      WHATSAPP_BUSINESS_ACCOUNT_ID: ${WHATSAPP_BUSINESS_ACCOUNT_ID:-${WHATSAPP_WABA_ID}}
      WHATSAPP_AUTH_TEMPLATE_NAME: ${WHATSAPP_AUTH_TEMPLATE_NAME:-auth_otp}
      WHATSAPP_VERIFY_TOKEN: ${WHATSAPP_VERIFY_TOKEN}
      # WhatsApp Embedded Signup (Meta App)
      WHATSAPP_APP_ID: ${WHATSAPP_APP_ID}
      WHATSAPP_APP_SECRET: ${WHATSAPP_APP_SECRET}
      WHATSAPP_CONFIG_ID: ${WHATSAPP_CONFIG_ID}
      # WhatsApp Personal API (TechnoPlus)
      WHATSAPP_API_URL: ${WHATSAPP_API_URL:-https://message.dashboard.technoplus.tech}
      WHATSAPP_SESSION_ID: ${WHATSAPP_SESSION_ID}
      WHATSAPP_ACCESS_TOKEN: ${WHATSAPP_ACCESS_TOKEN}
      # Push Notifications
      VAPID_PUBLIC_KEY: ${VAPID_PUBLIC_KEY}
      VAPID_PRIVATE_KEY: ${VAPID_PRIVATE_KEY}
      VAPID_SUBJECT: ${VAPID_SUBJECT:-mailto:notifications@rukny.work}
      # Al-Qaseh Payment Gateway
      QASEH_API_URL: ${QASEH_API_URL:-https://api-test.alqaseh.com/v1}
      QASEH_CLIENT_ID: ${QASEH_CLIENT_ID}
      QASEH_CLIENT_SECRET: ${QASEH_CLIENT_SECRET}
      QASEH_REDIRECT_URL: ${QASEH_REDIRECT_URL}
      QASEH_WEBHOOK_URL: ${QASEH_WEBHOOK_URL}
    networks:
      - rukny_network

  # ─── Next.js Dashboard App (app.rukny.io) ───
  app:
    build:
      context: .
      dockerfile: apps/app/Dockerfile
      args:
        - API_BACKEND_URL=http://api:3001
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_EXTERNAL_URL:-https://api.rukny.io/api/v1}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://app.rukny.io}
        - NEXT_PUBLIC_PUBLIC_SITE_URL=${NEXT_PUBLIC_PUBLIC_SITE_URL:-https://rukny.io}
        - NEXT_PUBLIC_ACCOUNTS_URL=${NEXT_PUBLIC_ACCOUNTS_URL:-https://accounts.rukny.io}
        - NEXT_PUBLIC_BUSINESS_URL=${NEXT_PUBLIC_BUSINESS_URL:-https://business.rukny.io}
        - NEXT_PUBLIC_DEVELOPERS_URL=${NEXT_PUBLIC_DEVELOPERS_URL:-https://developers.rukny.io}
        - NEXT_PUBLIC_FORMS_URL=${NEXT_PUBLIC_FORMS_URL:-https://forms.rukny.io}
        - NEXT_PUBLIC_ROOT_DOMAIN=${NEXT_PUBLIC_ROOT_DOMAIN:-rukny.io}
    container_name: rukny_app
    restart: always
    ports:
      - "127.0.0.1:3000:3000"
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3000
      HOSTNAME: 0.0.0.0
      API_BACKEND_URL: http://api:3001
      API_URL: http://api:3001
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_EXTERNAL_URL:-https://api.rukny.io/api/v1}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.rukny.io}
      NEXT_PUBLIC_PUBLIC_SITE_URL: ${NEXT_PUBLIC_PUBLIC_SITE_URL:-https://rukny.io}
      NEXT_PUBLIC_ACCOUNTS_URL: ${NEXT_PUBLIC_ACCOUNTS_URL:-https://accounts.rukny.io}
      NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN:-rukny.io}
    networks:
      - rukny_network

  # ─── Accounts App ───
  accounts:
    build:
      context: .
      dockerfile: apps/accounts/Dockerfile
      args:
        - API_BACKEND_URL=http://api:3001
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_EXTERNAL_URL:-https://api.rukny.io/api/v1}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://app.rukny.io}
        - NEXT_PUBLIC_ACCOUNTS_URL=${NEXT_PUBLIC_ACCOUNTS_URL:-https://accounts.rukny.io}
        - NEXT_PUBLIC_BUSINESS_URL=${NEXT_PUBLIC_BUSINESS_URL:-https://business.rukny.io}
        - NEXT_PUBLIC_DEVELOPERS_URL=${NEXT_PUBLIC_DEVELOPERS_URL:-https://developers.rukny.io}
        - NEXT_PUBLIC_FORMS_URL=${NEXT_PUBLIC_FORMS_URL:-https://forms.rukny.io}
        - NEXT_PUBLIC_ROOT_DOMAIN=${NEXT_PUBLIC_ROOT_DOMAIN:-rukny.io}
        - NEXT_PUBLIC_OAUTH_GOOGLE_ENABLED=${NEXT_PUBLIC_OAUTH_GOOGLE_ENABLED:-true}
        - NEXT_PUBLIC_OAUTH_LINKEDIN_ENABLED=${NEXT_PUBLIC_OAUTH_LINKEDIN_ENABLED:-true}
        - NEXT_PUBLIC_OAUTH_GITHUB_ENABLED=${NEXT_PUBLIC_OAUTH_GITHUB_ENABLED:-true}
        - NEXT_PUBLIC_OAUTH_FACEBOOK_ENABLED=${NEXT_PUBLIC_OAUTH_FACEBOOK_ENABLED:-false}
    container_name: rukny_accounts
    restart: always
    ports:
      - "127.0.0.1:3005:3005"
    depends_on:
      - api
    environment:
      NODE_ENV: production
      API_BACKEND_URL: http://api:3001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_EXTERNAL_URL:-https://api.rukny.io/api/v1}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://rukny.io}
    networks:
      - rukny_network

  # ─── Next.js HQ App ───
  hq:
    build:
      context: .
      dockerfile: apps/hq/Dockerfile
      args:
        - API_BACKEND_URL=http://api:3001
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_EXTERNAL_URL:-https://api.rukny.io/api/v1}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://app.rukny.io}
        - NEXT_PUBLIC_ACCOUNTS_URL=${NEXT_PUBLIC_ACCOUNTS_URL:-https://accounts.rukny.io}
        - NEXT_PUBLIC_BUSINESS_URL=${NEXT_PUBLIC_BUSINESS_URL:-https://business.rukny.io}
        - NEXT_PUBLIC_DEVELOPERS_URL=${NEXT_PUBLIC_DEVELOPERS_URL:-https://developers.rukny.io}
        - NEXT_PUBLIC_FORMS_URL=${NEXT_PUBLIC_FORMS_URL:-https://forms.rukny.io}
        - NEXT_PUBLIC_ROOT_DOMAIN=${NEXT_PUBLIC_ROOT_DOMAIN:-rukny.io}
    container_name: rukny_hq
    restart: always
    ports:
      - "0.0.0.0:3002:3002"
    depends_on:
      - api
    environment:
      NODE_ENV: production
      API_BACKEND_URL: http://api:3001
      API_URL: http://api:3001
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    networks:
      - rukny_network

  # ─── Next.js Business Hub (apps/business) ───
  business:
    build:
      context: .
      dockerfile: apps/business/Dockerfile
      args:
        API_BACKEND_URL: http://api:3001
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_EXTERNAL_URL:-https://api.rukny.io/api/v1}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.rukny.io}
        NEXT_PUBLIC_ACCOUNTS_URL: https://${ACCOUNTS_DOMAIN:-accounts.rukny.io}
        NEXT_PUBLIC_BUSINESS_URL: https://${BUSINESS_DOMAIN:-business.rukny.io}
        NEXT_PUBLIC_DEVELOPERS_URL: https://${DEVELOPERS_DOMAIN:-developers.rukny.io}
        NEXT_PUBLIC_FORMS_URL: ${NEXT_PUBLIC_FORMS_URL:-https://forms.rukny.io}
        NEXT_PUBLIC_PUBLIC_SITE_URL: ${FORM_PUBLIC_BASE_URL:-https://rukny.io}
        NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN:-rukny.io}
        JWT_SECRET: ${JWT_SECRET}
    container_name: rukny_business
    restart: always
    ports:
      - "127.0.0.1:3003:3003"
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3003
      HOSTNAME: 0.0.0.0
      API_BACKEND_URL: http://api:3001
      API_URL: http://api:3001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_EXTERNAL_URL:-https://api.rukny.io/api/v1}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.rukny.io}
      NEXT_PUBLIC_ACCOUNTS_URL: https://${ACCOUNTS_DOMAIN:-accounts.rukny.io}
      NEXT_PUBLIC_BUSINESS_URL: https://${BUSINESS_DOMAIN:-business.rukny.io}
      NEXT_PUBLIC_DEVELOPERS_URL: https://${DEVELOPERS_DOMAIN:-developers.rukny.io}
      NEXT_PUBLIC_FORMS_URL: ${NEXT_PUBLIC_FORMS_URL:-https://forms.rukny.io}
      NEXT_PUBLIC_PUBLIC_SITE_URL: ${FORM_PUBLIC_BASE_URL:-https://rukny.io}
      NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN:-rukny.io}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    networks:
      - rukny_network

  # ─── Next.js Public App ───
  public:
    build:
      context: .
      dockerfile: apps/public/Dockerfile
      args:
        - API_BACKEND_URL=http://api:3001
        - NEXT_PUBLIC_API_URL=${NEXT_PUBLIC_API_EXTERNAL_URL:-https://api.rukny.io/api/v1}
        - NEXT_PUBLIC_APP_URL=${NEXT_PUBLIC_APP_URL:-https://app.rukny.io}
        - NEXT_PUBLIC_ACCOUNTS_URL=${NEXT_PUBLIC_ACCOUNTS_URL:-https://accounts.rukny.io}
        - NEXT_PUBLIC_BUSINESS_URL=${NEXT_PUBLIC_BUSINESS_URL:-https://business.rukny.io}
        - NEXT_PUBLIC_DEVELOPERS_URL=${NEXT_PUBLIC_DEVELOPERS_URL:-https://developers.rukny.io}
        - NEXT_PUBLIC_FORMS_URL=${NEXT_PUBLIC_FORMS_URL:-https://forms.rukny.io}
        - NEXT_PUBLIC_ROOT_DOMAIN=${NEXT_PUBLIC_ROOT_DOMAIN:-rukny.io}
    container_name: rukny_public
    restart: always
    ports:
      - "127.0.0.1:3006:3006"
    depends_on:
      - api
    environment:
      API_BACKEND_URL: http://api:3001
      API_URL: http://api:3001
    networks:
      - rukny_network

  # ─── Next.js Developer Portal (apps/developer) ───
  developers:
    build:
      context: .
      dockerfile: apps/developer/Dockerfile
      args:
        API_BACKEND_URL: http://api:3001
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_EXTERNAL_URL:-https://api.rukny.io/api/v1}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.rukny.io}
        NEXT_PUBLIC_ACCOUNTS_URL: https://${ACCOUNTS_DOMAIN:-accounts.rukny.io}
        NEXT_PUBLIC_BUSINESS_URL: https://${BUSINESS_DOMAIN:-business.rukny.io}
        NEXT_PUBLIC_DEVELOPERS_URL: https://${DEVELOPERS_DOMAIN:-developers.rukny.io}
        NEXT_PUBLIC_FORMS_URL: ${NEXT_PUBLIC_FORMS_URL:-https://forms.rukny.io}
        NEXT_PUBLIC_PUBLIC_SITE_URL: ${FORM_PUBLIC_BASE_URL:-https://rukny.io}
        NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN:-rukny.io}
    container_name: rukny_developers
    restart: always
    ports:
      - "127.0.0.1:3004:3004"
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3004
      HOSTNAME: 0.0.0.0
      API_BACKEND_URL: http://api:3001
      API_URL: http://api:3001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_EXTERNAL_URL:-https://api.rukny.io/api/v1}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.rukny.io}
      NEXT_PUBLIC_ACCOUNTS_URL: https://${ACCOUNTS_DOMAIN:-accounts.rukny.io}
      NEXT_PUBLIC_BUSINESS_URL: https://${BUSINESS_DOMAIN:-business.rukny.io}
      NEXT_PUBLIC_DEVELOPERS_URL: https://${DEVELOPERS_DOMAIN:-developers.rukny.io}
      NEXT_PUBLIC_FORMS_URL: ${NEXT_PUBLIC_FORMS_URL:-https://forms.rukny.io}
      NEXT_PUBLIC_PUBLIC_SITE_URL: ${FORM_PUBLIC_BASE_URL:-https://rukny.io}
      NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN:-rukny.io}
      NEXT_PUBLIC_DEV_URL: https://${DEVELOPERS_DOMAIN:-developers.rukny.io}
      JWT_SECRET: ${JWT_SECRET}
    networks:
      - rukny_network

  # ─── Next.js Forms App ───
  forms:
    build:
      context: .
      dockerfile: apps/forms/Dockerfile
      args:
        API_BACKEND_URL: http://api:3001
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_EXTERNAL_URL:-https://api.rukny.io/api/v1}
        NEXT_PUBLIC_ACCOUNTS_URL: ${NEXT_PUBLIC_ACCOUNTS_URL:-https://accounts.rukny.io}
        NEXT_PUBLIC_FORMS_URL: ${NEXT_PUBLIC_FORMS_URL:-https://forms.rukny.io}
        NEXT_PUBLIC_PUBLIC_SITE_URL: ${FORM_PUBLIC_BASE_URL:-https://rukny.io}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.rukny.io}
        JWT_SECRET: ${JWT_SECRET}
    container_name: rukny_forms
    restart: always
    ports:
      - "127.0.0.1:3007:3007"
    depends_on:
      api:
        condition: service_started
    environment:
      NODE_ENV: production
      PORT: 3007
      HOSTNAME: 0.0.0.0
      # Public (also baked at build time for client bundles)
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_EXTERNAL_URL:-https://api.rukny.io/api/v1}
      NEXT_PUBLIC_ACCOUNTS_URL: ${NEXT_PUBLIC_ACCOUNTS_URL:-https://accounts.rukny.io}
      NEXT_PUBLIC_FORMS_URL: ${NEXT_PUBLIC_FORMS_URL:-https://forms.rukny.io}
      NEXT_PUBLIC_PUBLIC_SITE_URL: ${FORM_PUBLIC_BASE_URL:-https://rukny.io}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL:-https://app.rukny.io}
      # Server-only (BFF proxy + middleware JWT verify)
      API_BACKEND_URL: http://api:3001
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
    networks:
      - rukny_network

  # ─── pgAdmin Database Manager ───
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: rukny_pgadmin
    restart: always
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@rukny.io}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_LISTEN_PORT: 5050
      PGADMIN_CONFIG_ENHANCED_COOKIE_PROTECTION: "False"
      PGADMIN_CONFIG_WTF_CSRF_SSL_STRICT: "False"
      SCRIPT_NAME: ""
    ports:
      - "127.0.0.1:5050:5050"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - rukny_network

  # ─── Nginx Reverse Proxy ───
  nginx:
    image: nginx:alpine
    container_name: rukny_nginx
    restart: always
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/cloudflare-real-ip.conf:/etc/nginx/cloudflare-real-ip.conf:ro
      - ./nginx/includes:/etc/nginx/includes:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./nginx/ssl:/etc/nginx/ssl:ro
    depends_on:
      - api
      - app
      - hq
#      - workspace
      - public
      - accounts
      - developers
      - forms
      - business
    networks:
      - rukny_network

  # ─── Cloudflare Tunnel ───
  cloudflared:
    image: cloudflare/cloudflared:latest
    container_name: rukny_cloudflared
    restart: always
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
      - TUNNEL_TRANSPORT_PROTOCOL=http2
    networks:
      - rukny_network

volumes:
  postgres_data:
  redis_data:
  pgadmin_data:

networks:
  rukny_network:
    driver: bridge