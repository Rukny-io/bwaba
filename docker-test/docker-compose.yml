# ============================================
# Rukny — Docker Test (apps/app + tunnel)
# Usage:
#   cd docker-test
#   cp .env.example .env   # fill secrets + tunnel token
#   docker compose --profile tunnel up -d --build
# ============================================

name: rukny-docker-test

x-public-urls: &public-urls
  APP_URL: &app_url ${NEXT_PUBLIC_APP_URL}
  API_URL: &api_url ${NEXT_PUBLIC_API_EXTERNAL_URL}
  ACCOUNTS_URL: &accounts_url ${NEXT_PUBLIC_ACCOUNTS_URL}
  PUBLIC_SITE_URL: &public_site_url ${NEXT_PUBLIC_PUBLIC_SITE_URL}
  DEVELOPER_URL: &developer_url ${NEXT_PUBLIC_DEVELOPERS_URL}
  FORMS_URL: &forms_url ${NEXT_PUBLIC_FORMS_URL}

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER:-rukny_admin}
      POSTGRES_PASSWORD: ${DB_PASSWORD:?DB_PASSWORD required}
      POSTGRES_DB: ${DB_NAME:-rukny_docker_test}
    volumes:
      - postgres_docker_test_data:/var/lib/postgresql/data
    networks:
      - docker_test_network
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${DB_USER:-rukny_admin} -d ${DB_NAME:-rukny_docker_test}']
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:?REDIS_PASSWORD required}
    volumes:
      - redis_docker_test_data:/data
    networks:
      - docker_test_network
    healthcheck:
      test: ['CMD-SHELL', 'redis-cli -a "$REDIS_PASSWORD" ping']
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build:
      context: ../apps/api
      dockerfile: Dockerfile
    restart: unless-stopped
    command:
      - sh
      - -c
      - >-
        node -e "const net=require('net'); const retry=()=>{const socket=net.createConnection({host:'postgres',port:5432},()=>{socket.end(); process.exit(0);}); socket.on('error',()=>setTimeout(retry,1000));}; retry();"
        && npx prisma migrate deploy --config prisma/prisma.config.ts
        && node dist/main
    env_file:
      - .env
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DATABASE_URL: postgresql://${DB_USER:-rukny_admin}:${DB_PASSWORD}@postgres:5432/${DB_NAME:-rukny_docker_test}
      REDIS_URL: redis://:${REDIS_PASSWORD}@redis:6379
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET required}
      FORMS_OTP_PEPPER: ${FORMS_OTP_PEPPER:?FORMS_OTP_PEPPER required}
      TWO_FACTOR_ENCRYPTION_KEY: ${TWO_FACTOR_ENCRYPTION_KEY:-}
      INTERNAL_API_SECRET: ${INTERNAL_API_SECRET:-}
      FRONTEND_URL: *app_url
      FRONTEND_URL_ALT: *app_url
      APP_FRONTEND_URL: *app_url
      FORMS_APP_URL: *forms_url
      AUTH_FRONTEND_URL: *accounts_url
      AUTH_BASE_URL: ${API_PUBLIC_BASE}
      FORM_PUBLIC_BASE_URL: *public_site_url
      FORMS_FRONTEND_URL: *forms_url
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      COOKIE_HTTPONLY: 'true'
      COOKIE_SAMESITE: Lax
      GOOGLE_CALLBACK_URL: ${GOOGLE_CALLBACK_URL}
      LINKEDIN_CALLBACK_URL: ${LINKEDIN_CALLBACK_URL}
      LINKEDIN_INTEGRATION_CALLBACK_URL: ${LINKEDIN_INTEGRATION_CALLBACK_URL}
      FACEBOOK_CALLBACK_URL: ${FACEBOOK_CALLBACK_URL}
      INSTAGRAM_REDIRECT_URI: ${INSTAGRAM_REDIRECT_URI}
      YOUTUBE_REDIRECT_URI: ${YOUTUBE_REDIRECT_URI}
      GOOGLE_SHEETS_REDIRECT_URI: ${GOOGLE_SHEETS_REDIRECT_URI}
      QASEH_REDIRECT_URL: ${QASEH_REDIRECT_URL:-}
      QASEH_WEBHOOK_URL: ${QASEH_WEBHOOK_URL:-}
      GEOIP_PROVIDER: ${GEOIP_PROVIDER:-auto}
      TURNSTILE_SECRET_KEY: ${TURNSTILE_SECRET_KEY:-}
      TURNSTILE_SITE_KEY: ${TURNSTILE_SITE_KEY:-}
    networks:
      - docker_test_network

  accounts:
    build:
      context: ../apps/accounts
      dockerfile: Dockerfile
      args:
        API_BACKEND_URL: http://api:3001
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_EXTERNAL_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_ACCOUNTS_URL: ${NEXT_PUBLIC_ACCOUNTS_URL}
        NEXT_PUBLIC_DEVELOPERS_URL: ${NEXT_PUBLIC_DEVELOPERS_URL}
        NEXT_PUBLIC_FORMS_URL: ${NEXT_PUBLIC_FORMS_URL}
        NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - api
    environment:
      NODE_ENV: production
      API_BACKEND_URL: http://api:3001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_EXTERNAL_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_ACCOUNTS_URL: ${NEXT_PUBLIC_ACCOUNTS_URL}
    networks:
      - docker_test_network

  app:
    build:
      context: ..
      dockerfile: apps/app/Dockerfile
      args:
        API_BACKEND_URL: http://api:3001
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_EXTERNAL_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_ACCOUNTS_URL: ${NEXT_PUBLIC_ACCOUNTS_URL}
        NEXT_PUBLIC_BUSINESS_URL: ${NEXT_PUBLIC_BUSINESS_URL:-}
        NEXT_PUBLIC_DEVELOPERS_URL: ${NEXT_PUBLIC_DEVELOPERS_URL}
        NEXT_PUBLIC_FORMS_URL: ${NEXT_PUBLIC_FORMS_URL}
        NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN}
        NEXT_PUBLIC_FORM_PUBLIC_ORIGIN: ${NEXT_PUBLIC_FORM_PUBLIC_ORIGIN}
        NEXT_PUBLIC_EMBED_FORM_SLUG: ${NEXT_PUBLIC_EMBED_FORM_SLUG}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - api
    environment:
      NODE_ENV: production
      API_BACKEND_URL: http://api:3001
      API_URL: http://api:3001
      NEXT_PUBLIC_API_EXTERNAL_URL: ${NEXT_PUBLIC_API_EXTERNAL_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN}
      NEXT_PUBLIC_FORM_PUBLIC_ORIGIN: ${NEXT_PUBLIC_FORM_PUBLIC_ORIGIN}
      NEXT_PUBLIC_EMBED_FORM_SLUG: ${NEXT_PUBLIC_EMBED_FORM_SLUG}
    ports:
      - '127.0.0.1:3000:3000'
    networks:
      - docker_test_network

  public:
    build:
      context: ..
      dockerfile: apps/public/Dockerfile
      args:
        API_BACKEND_URL: http://api:3001
        NEXT_PUBLIC_API_URL: /api/v1
        NEXT_PUBLIC_API_EXTERNAL_URL: ${NEXT_PUBLIC_API_EXTERNAL_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_PUBLIC_SITE_URL}
        NEXT_PUBLIC_ACCOUNTS_URL: ${NEXT_PUBLIC_ACCOUNTS_URL}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      API_BACKEND_URL: http://api:3001
      NEXT_PUBLIC_API_URL: /api/v1
      NEXT_PUBLIC_API_EXTERNAL_URL: ${NEXT_PUBLIC_API_EXTERNAL_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_PUBLIC_SITE_URL}
      NEXT_PUBLIC_ACCOUNTS_URL: ${NEXT_PUBLIC_ACCOUNTS_URL}
      NEXT_PUBLIC_PUBLIC_SITE_URL: ${NEXT_PUBLIC_PUBLIC_SITE_URL}
    networks:
      - docker_test_network

  developer:
    build:
      context: ../apps/developer
      dockerfile: Dockerfile
      args:
        API_BACKEND_URL: http://api:3001
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_EXTERNAL_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        NEXT_PUBLIC_ACCOUNTS_URL: ${NEXT_PUBLIC_ACCOUNTS_URL}
        NEXT_PUBLIC_DEVELOPERS_URL: ${NEXT_PUBLIC_DEVELOPERS_URL}
        NEXT_PUBLIC_FORMS_URL: ${NEXT_PUBLIC_FORMS_URL}
        NEXT_PUBLIC_PUBLIC_SITE_URL: ${NEXT_PUBLIC_PUBLIC_SITE_URL}
        NEXT_PUBLIC_ROOT_DOMAIN: ${NEXT_PUBLIC_ROOT_DOMAIN}
    restart: unless-stopped
    depends_on:
      - api
    environment:
      NODE_ENV: production
      API_BACKEND_URL: http://api:3001
      API_URL: http://api:3001
      NEXT_PUBLIC_API_EXTERNAL_URL: ${NEXT_PUBLIC_API_EXTERNAL_URL}
      NEXT_PUBLIC_DEVELOPERS_URL: ${NEXT_PUBLIC_DEVELOPERS_URL}
      NEXT_PUBLIC_FORMS_URL: ${NEXT_PUBLIC_FORMS_URL}
      NEXT_PUBLIC_PUBLIC_SITE_URL: ${NEXT_PUBLIC_PUBLIC_SITE_URL}
      NEXT_PUBLIC_ACCOUNTS_URL: ${NEXT_PUBLIC_ACCOUNTS_URL}
    networks:
      - docker_test_network

  forms:
    build:
      context: ..
      dockerfile: apps/forms/Dockerfile
      args:
        API_BACKEND_URL: http://api:3001
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_EXTERNAL_URL}
        NEXT_PUBLIC_ACCOUNTS_URL: ${NEXT_PUBLIC_ACCOUNTS_URL}
        NEXT_PUBLIC_FORMS_URL: ${NEXT_PUBLIC_FORMS_URL}
        NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
        JWT_SECRET: ${JWT_SECRET}
    restart: unless-stopped
    env_file:
      - .env
    depends_on:
      - api
    environment:
      NODE_ENV: production
      PORT: 3007
      HOSTNAME: 0.0.0.0
      API_BACKEND_URL: http://api:3001
      NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_EXTERNAL_URL}
      NEXT_PUBLIC_ACCOUNTS_URL: ${NEXT_PUBLIC_ACCOUNTS_URL}
      NEXT_PUBLIC_FORMS_URL: ${NEXT_PUBLIC_FORMS_URL}
      NEXT_PUBLIC_APP_URL: ${NEXT_PUBLIC_APP_URL}
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_DOMAIN: ${COOKIE_DOMAIN:-}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
    networks:
      - docker_test_network

  nginx:
    image: nginx:alpine
    restart: unless-stopped
    depends_on:
      - app
      - api
      - accounts
      - public
      - developer
      - forms
    environment:
      APP_HOST: ${APP_HOST}
      API_HOST: ${API_HOST}
      ACCOUNTS_HOST: ${ACCOUNTS_HOST}
      PUBLIC_HOST: ${PUBLIC_HOST}
      DEVELOPER_HOST: ${DEVELOPER_HOST}
      FORMS_HOST: ${FORMS_HOST}
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/templates:/etc/nginx/templates:ro
      - ../nginx/cloudflare-real-ip.conf:/etc/nginx/cloudflare-real-ip.conf:ro
      - ../nginx/includes:/etc/nginx/includes:ro
    ports:
      - '127.0.0.1:8080:80'
    networks:
      - docker_test_network

  cloudflared:
    profiles: [tunnel]
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      TUNNEL_TOKEN: ${CLOUDFLARE_TUNNEL_TOKEN:-}
      TUNNEL_TRANSPORT_PROTOCOL: http2
    depends_on:
      - nginx
    networks:
      - docker_test_network

networks:
  docker_test_network:
    driver: bridge

volumes:
  postgres_docker_test_data:
  redis_docker_test_data:
