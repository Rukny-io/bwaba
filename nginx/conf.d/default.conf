# ─── Upstream Definitions ───
# apps/app (rukny.work) runs outside this stack — see docker-test/docker-compose.app.yml
# upstream app_upstream {
#     server app:3000 max_fails=3 fail_timeout=5s;
# }

upstream public_upstream {
    server public:3006 max_fails=3 fail_timeout=5s;
}

upstream accounts_upstream {
    # Avoid marking upstream down after a single transient connect refusal
    # (common during container restart/rollout windows).
    server accounts:3005 max_fails=3 fail_timeout=5s;
}

upstream api_upstream {
    server api:3001;
}

upstream hq_upstream {
    server hq:3002 max_fails=3 fail_timeout=5s;
}

# upstream business_upstream {
#     server business:3003;
# }

upstream developers_upstream {
    server developers:3004;
}

upstream forms_upstream {
    server forms:3007 max_fails=3 fail_timeout=5s;
}

upstream pgadmin_upstream {
    server pgadmin:5050;
}


