    }

    location ~* ^/(logos|favicon\.ico|.*\.(?:css|js|mjs|map|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico))$ {
        limit_req zone=static burst=600 nodelay;
        include /etc/nginx/includes/proxy-cloudflare.conf;
        proxy_pass http://accounts_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        limit_req zone=web burst=150;
        include /etc/nginx/includes/proxy-cloudflare.conf;
        proxy_pass http://accounts_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}

# ─── API: api.rukny.io ───
server {
    listen 80;
    server_name api.rukny.io;

    # Upload endpoints need longer timeouts and larger body size
    location ~* /api/v1/(admin/wallpapers/upload|upload) {
        client_max_body_size 55M;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 60s;
        include /etc/nginx/includes/proxy-cloudflare.conf;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
    }

    location / {
        limit_req zone=api burst=20 nodelay;
        include /etc/nginx/includes/proxy-cloudflare.conf;
        proxy_pass http://api_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}

