# ─── Public Forms: rukny.io ───
server {
    listen 80;
    server_name rukny.io www.rukny.io;

    location ^~ /_next/static/ {
        limit_req zone=static burst=300;
        include /etc/nginx/includes/proxy-cloudflare.conf;
        proxy_pass http://public_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    location ~* ^/(logos|favicon\.ico|.*\.(?:css|js|mjs|map|woff2?|ttf|otf|eot|svg|png|jpe?g|gif|webp|ico))$ {
        limit_req zone=static burst=200;
        include /etc/nginx/includes/proxy-cloudflare.conf;
        proxy_pass http://public_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }

    location / {
        limit_req zone=web burst=150;
        include /etc/nginx/includes/proxy-cloudflare.conf;
        proxy_pass http://public_upstream;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_cache_bypass $http_upgrade;
    }
}

# ─── Accounts: accounts.rukny.io ───
server {
    listen 80;
    server_name accounts.rukny.io;

    location ^~ /_next/static/ {
        limit_req zone=static burst=800 nodelay;
