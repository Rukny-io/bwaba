# Forward visitor identity + Cloudflare geo headers to upstream services.
# Requires cloudflare-real-ip.conf so $remote_addr is the real client IP.
# Enable Cloudflare: Network → IP Geolocation → ON (adds CF-IPCountry / CF-IPCity / CF-IPRegion)

proxy_set_header Host $host;
proxy_set_header X-Real-IP $remote_addr;
proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
proxy_set_header X-Forwarded-Proto https;
proxy_set_header X-Forwarded-Host $host;

proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
proxy_set_header CF-IPCountry $http_cf_ipcountry;
proxy_set_header CF-IPCity $http_cf_ipcity;
proxy_set_header CF-IPRegion $http_cf_ipregion;
proxy_set_header CF-IPRegionCode $http_cf_ipregioncode;
proxy_set_header CF-IPLatitude $http_cf_iplatitude;
proxy_set_header CF-IPLongitude $http_cf_iplongitude;
proxy_set_header CF-Ray $http_cf_ray;

# Legacy / managed-transform aliases
proxy_set_header CF-Region $http_cf_region;
proxy_set_header CF-Region-Code $http_cf_region_code;
