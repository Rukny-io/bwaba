worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    # Cloudflare Proxy (orange cloud) — restore real visitor IP + geo headers
    include /etc/nginx/cloudflare-real-ip.conf;

    # Docker internal reverse proxies (cloudflared, compose networks)
    set_real_ip_from 172.16.0.0/12;
    set_real_ip_from 10.0.0.0/8;
    real_ip_header CF-Connecting-IP;
    real_ip_recursive on;

    # Logging
    log_format main '$remote_addr - $remote_user [$time_local] "$request" '
                    '$status $body_bytes_sent "$http_referer" '
                    '"$http_user_agent" "$http_x_forwarded_for"';
    access_log /var/log/nginx/access.log main;
    error_log  /var/log/nginx/error.log warn;

    # Performance
    sendfile        on;
    tcp_nopush      on;
    tcp_nodelay     on;
    keepalive_timeout 65;

    # Gzip compression
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_types text/plain text/css text/xml application/json application/javascript application/xml+rss application/atom+xml image/svg+xml;

    # Security headers
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    # Rate limiting
    # Keep API requests strict while allowing higher burst capacity for static assets.
    limit_req_zone $binary_remote_addr zone=api:10m rate=30r/s;
    # Web/RSC requests from Next.js can spike during route prefetch and hydration.
    # Keep protection enabled with a higher sustained rate to avoid user-visible delays.
    limit_req_zone $binary_remote_addr zone=web:10m rate=80r/s;
    # Static assets can burst heavily on first-page load (many JS/CSS chunks).
    # Keep protection enabled, but with a higher ceiling to avoid user-visible delays.
    limit_req_zone $binary_remote_addr zone=static:20m rate=1000r/s;

    # File upload size (50MB for wallpaper/video uploads)
    client_max_body_size 55M;

    # Re-resolve Docker service names when containers are recreated (avoids stale upstream IPs)
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Include server blocks
    include /etc/nginx/conf.d/*.conf;
}
